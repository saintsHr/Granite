name: ci

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: true
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libgl1-mesa-dev \
            libglfw3-dev \
            libglm-dev \
            libbullet-dev \
            gcc g++ clang

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake --preset gcc-ci
          else
            cmake --preset clang-ci
          fi

      - name: Build (CI)
        run: |
          cmake --build build/${{ matrix.compiler }}-ci -j$(nproc)

      - name: Build (Release)
        run: |
          cmake -B build/release-${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}

          cmake --build build/release-${{ matrix.compiler }} -j$(nproc)

      - name: Verify Engine
        run: |
          test -s build/${{ matrix.compiler }}-ci/libgranite.a
